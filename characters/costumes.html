<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гардероб — проверка ассетов</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeae3;font:14px system-ui;color:#373b40}header{padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}select,button{padding:8px;border:1px solid #b7b4ad;border-radius:8px;background:#fff}main{position:relative;max-width:1400px;margin:auto}canvas{display:block;width:100%;height:57.8vw;max-height:800px}.labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);pointer-events:none}.labels span{align-self:end;text-align:center;padding:6px;font-size:13px}.labels small{display:block;color:#697078;font-size:10px}footer{padding:12px 24px;color:#62666c;font-size:12px}#status{padding:0 24px}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<header><h1>Гардероб / ревизия</h1><label>Каталог <select id="catalog"><option value="assets">Предметы NVIDIA</option><option value="all">Все костюмы</option><option value="patterns">Узоры</option></select></label><label>Ракурс <select id="view"><option value="front">¾ спереди</option><option value="back">¾ сзади</option><option value="side">Сбоку</option></select></label><button id="prev">←</button><span id="page"></span><button id="next">→</button></header>
<div id="status">Загрузка моделей…</div><main><canvas></canvas><div class="labels"></div></main><footer>Предметы: NVIDIA SimReady · CC BY 4.0. Принты: Hero Patterns / Steve Schoger · CC BY 4.0 и авторские мотивы игры · CC0.</footer>
<script type="module">
import * as T from '../vendor/three.module.min.js';
import {createCubeCharacter} from './cube-character.mjs';
import {CUBE_COSMETICS,preloadCostume} from './cube-wardrobe.mjs';
import {COSTUME_ASSETS} from './costume-manifest.mjs';
import {PRINTS,printsReady} from './cube-print.mjs';import {PRINT_CATALOG} from './print-catalog.mjs';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene();scene.background=new T.Color(0xeeeae3);scene.add(new T.HemisphereLight(0xffffff,0xb9b6b0,2));const key=new T.DirectionalLight(0xfff7eb,2.5);key.position.set(2,6,4);scene.add(key);
const camera=new T.OrthographicCamera(-6.4,6.4,3.5,-3.9,.1,100);camera.position.set(0,0,20);camera.lookAt(0,0,0);
let page=0,rigs=[],serial=0;const params=new URLSearchParams(location.search);document.querySelector('#catalog').value=params.get('catalog')||'assets';document.querySelector('#view').value=params.get('view')||'front';
const names={belly:'Абстрактное конфетти',stripes:'Диагональные полосы',polka:'Горошек',flames:'Карамельные волны',stars:'Пятиконечные звёзды',lightning:'Ломаный ритм',rings:'Гипнотические кольца',diamonds:'Арлекин',clouds:'Пушистые облака',leaves:'Листья',circuit:'Микросхема',hexagons:'Медовые соты',...Object.fromEntries(PRINT_CATALOG.map(([id,,,title])=>[id,title]))};
function draw(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);renderer.render(scene,camera);}
async function refresh(){const token=++serial;for(const r of rigs){scene.remove(r.root);r.dispose();}rigs=[];const mode=document.querySelector('#catalog').value;
const items=mode==='patterns'?Object.keys(PRINTS).map(pattern=>({hat:'none',pattern,title:names[pattern]})):mode==='all'?CUBE_COSMETICS:Object.entries(COSTUME_ASSETS).map(([hat,c])=>({hat,...c}));
const pages=Math.ceil(items.length/8);page=Math.max(0,Math.min(page,pages-1));const subset=items.slice(page*8,page*8+8);document.querySelector('#page').textContent=`${page+1} / ${pages}`;
const angle={front:.5,back:Math.PI+.5,side:Math.PI/2}[document.querySelector('#view').value];
subset.forEach((c,i)=>{const r=createCubeCharacter(T,{skin:{hat:c.hat,pattern:c.pattern||'plain',c1:0xffd83b,c2:0x285ba0}});r.blobShadow.visible=false;r.animate(0,{pose:'idle'});r.root.position.set((i%4-1.5)*3.2, -Math.floor(i/4)*3.7+.15,0);r.root.rotation.y=angle;rigs.push(r);scene.add(r.root);});
document.querySelector('.labels').innerHTML=subset.map(c=>`<span>${c.icon||''} ${c.title}<small>${c.tris?c.tris+' △ · ':''}${c.slot==='back'?'За спиной':mode==='patterns'?'Принт':'Сверху / костюм'}</small></span>`).join('');
document.querySelector('#status').textContent='Загрузка…';draw();const result=await Promise.allSettled(subset.map(c=>preloadCostume(T,c.hat)));await printsReady();if(token!==serial)return;const failures=result.filter(r=>r.status==='rejected').length;document.querySelector('#status').textContent=failures?`Ошибки загрузки: ${failures}`:`Готово · ${subset.length} вариантов`;draw();}
for(const id of ['catalog','view'])document.querySelector('#'+id).onchange=()=>{page=0;refresh();};document.querySelector('#prev').onclick=()=>{page--;refresh();};document.querySelector('#next').onclick=()=>{page++;refresh();};addEventListener('resize',draw);refresh();
</script></html>
