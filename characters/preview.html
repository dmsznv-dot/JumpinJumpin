<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый персонаж — проверка рига</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9edf4;color:#27334e;font:16px system-ui}canvas{display:block;width:100%;height:100dvh}aside{max-height:calc(100dvh - 48px);overflow:auto;position:absolute;left:24px;top:24px;width:300px;padding:22px;background:#fffffff0;border-radius:20px;box-shadow:0 8px 30px #24355012}h1{font-size:21px;margin:0 0 10px}p{font-size:14px;color:#647189;line-height:1.5}label{display:block;font-weight:600;margin-top:18px}select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #cbd2df;background:white;color:inherit;cursor:pointer}select{width:100%;margin-top:8px}.views{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}a{display:block;margin-top:14px;color:#6a4ed0}input{accent-color:#7353cc}footer{position:absolute;bottom:18px;left:24px;font-size:13px;color:#63708a}@media(max-width:650px){aside{top:12px;left:12px;width:240px;padding:16px}aside p{display:none}h1{font-size:17px}canvas{height:100dvh}footer{display:none}}@media(max-width:650px){aside{top:auto;bottom:0;left:0;width:100%;max-height:32dvh;overflow:auto;padding:10px 14px;border-radius:16px 16px 0 0}aside h1{font-size:15px}.views{margin:5px 0}label{margin-top:8px}select,button{padding:7px}a{display:inline-block;margin:8px 12px 0 0;font-size:12px}} </style>
<canvas id="view"></canvas><aside><h1>Новый персонаж</h1><p>Мягкий куб по модельной карте: утопленное лицо и две ножки. 10 костей, 11 движений. Корпус, лицо и ботинки окрашиваются отдельно.</p>
<label>Окраска</label><div class="views"><button data-color="#ffdb20">Жёлтый</button><button data-color="#60cce5">Голубой</button><button data-color="#bca1ed">Сиреневый</button><button data-color="#8ce0ad">Мятный</button></div><label for="costume">Шапка / костюм</label><select id="costume"></select><label for="pattern">Паттерн</label><select id="pattern"></select><label for="pose">Движение</label><select id="pose"><option value="idle">Ожидание</option><option value="run">Бег</option><option value="jump">Прыжок</option><option value="fall">Падение</option><option value="dive">Нырок</option><option value="land">Приземление</option><option value="win">Победа</option><option value="wave">Приветствие</option><option value="dance">Танец</option><option value="sit">Сидит</option><option value="look">Любопытство</option><option value="lobby">Эмоции в лобби</option></select>
<label>Ракурс</label><div class="views"><button data-view="0">Анфас</button><button data-view="0.65">¾</button><button data-view="1.57">Сбоку</button><button data-view="3.14">Сзади</button></div>
<label><input id="skeleton" type="checkbox"> Показать скелет</label><label><input id="spin" type="checkbox"> Вращать модель</label>
<a href="../index.html">Проверить в игре →</a><a href="../assets/models/cube-runner.glb" download>Скачать GLB с анимациями</a></aside><footer>Переключайте ракурсы и движения для проверки модели</footer>
<script type="module">
import {CUBE_COSMETICS} from './cube-wardrobe.mjs';
import * as THREE from '../vendor/three.module.min.js';import {createCubeCharacter} from './cube-character.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9edf4);
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
scene.add(new THREE.HemisphereLight(0xffffff,0x8f9bac,2.2));const sun=new THREE.DirectionalLight(0xfff1df,2.5);sun.position.set(3,5,5);scene.add(sun);
let color='#ffdb20';const costume=document.querySelector('#costume'),pattern=document.querySelector('#pattern');
CUBE_COSMETICS.forEach(c=>costume.add(new Option(c.icon+' '+c.title,c.hat)));
['plain','belly','stripes','polka','flames','stars','lightning','rings','diamonds'].forEach((id,i)=>pattern.add(new Option(['Чистый цвет','Пятно','Полосы','Горошек','Пламя','Звёзды','Молнии','Кольца','Ромбы'][i],id)));
let rig,helper;
function rebuild(){if(rig){scene.remove(rig.root,helper);helper.dispose();rig.dispose();}rig=createCubeCharacter(THREE,{skin:{hat:costume.value||'none',c1:parseInt(color.slice(1),16),c2:0xf53867,pattern:pattern.value||'plain'}});scene.add(rig.root);helper=new THREE.SkeletonHelper(rig.root);helper.visible=document.querySelector('#skeleton').checked;scene.add(helper);}
rebuild();costume.onchange=pattern.onchange=rebuild;
const floor=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.2,.12,64),new THREE.MeshStandardMaterial({color:0xcdd5e2,roughness:.8}));floor.position.y=-.09;scene.add(floor);
const camera=new THREE.PerspectiveCamera(33,1,.01,100);camera.position.set(0,1.35,5.7);camera.lookAt(0,1.12,0);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.position.x=innerWidth>650?-.45:0;camera.position.z=innerWidth>650?6.7:8.3;camera.lookAt(innerWidth>650?-.45:0,innerWidth>650?1.12:.65,0);camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
const pose=document.querySelector('#pose');let time=performance.now(),yaw=0;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{yaw=Number(b.dataset.view);rig.root.rotation.y=yaw;});
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;rebuild();});
pose.onchange=()=>rig.resetAnimation();document.querySelector('#skeleton').onchange=e=>helper.visible=e.target.checked;
function frame(now){const dt=Math.min(.05,(now-time)/1000);time=now;if(document.querySelector('#spin').checked){yaw+=dt*.4;rig.root.rotation.y=yaw;}rig.animate(dt,{pose:pose.value,speed:pose.value==='run'?7:0});renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
